name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      # No LFS: the small cells the tests read (NV_64, ClV_128) and the NV_512
      # subset with the mixed A1/Ey modes are plain git blobs. Only the
      # whole-cell NV_512 checks need the 19 MB LFS file and skip without it,
      # which keeps LFS bandwidth at zero.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Run tests
        run: pytest -q

      # The cluster scripts have their own suite, outside testpaths, so plain pytest skips it.
      - name: Run cluster-script tests
        if: success() || failure()  # also when the package tests failed
        run: pytest -q scripts/tests
